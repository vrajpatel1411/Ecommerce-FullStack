# Application name (optional, can inherit from default)
spring.application.name=backend

# Database configuration (same URL, but externalize credentials)
spring.datasource.url=jdbc:mysql://database-1.cljzetfeajxz.us-east-1.rds.amazonaws.com:3306/ecommerce
spring.datasource.username=${DB_USERNAME}  # Externalized via environment variable
spring.datasource.password=${DB_PASSWORD}  # Externalized via environment variable
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5 


frontend.url=https://vrajpatelproject.software

# Stripe configuration (production key)
stripe.secret.key=${STRIPE_SECRET_KEY}  # Use live key via environment variable

# Server and monitoring
server.port=8080
management.endpoints.web.exposure.include=health,metrics  # Enable Actuator endpoints