steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args: ['build', '-t', 'northamerica-northeast2-docker.pkg.dev/ecommerce-451423/ecommerce-backend/ecommerce-backend:$COMMIT_SHA', '.']

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'northamerica-northeast2-docker.pkg.dev/ecommerce-451423/ecommerce-backend/ecommerce-backend:$COMMIT_SHA']

  # Update the deployment yaml with the new image
  - name: 'gcr.io/cloud-builders/gcloud'
    dir: 'backend/kubernetes'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s|northamerica-northeast2-docker.pkg.dev/ecommerce-451423/ecommerce-backend/ecommerce-backend:.*|northamerica-northeast2-docker.pkg.dev/ecommerce-451423/ecommerce-backend/ecommerce-backend:$COMMIT_SHA|g" kubernetes/deploy.yaml || exit 1
        cat deploy.yaml  # Optional: log the updated file for debugging

  # Apply the updated deployment yaml
  - name: 'gcr.io/cloud-builders/kubectl'
    dir: 'backend/kubernetes'
    args: ['apply', '-f', 'deploy.yaml']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=northamerica-northeast2'  # Replace with your GKE zone, e.g., northamerica-northeast2-a
      - 'CLOUDSDK_CONTAINER_CLUSTER=ecommerce-backend-cluster'  # Replace with your GKE cluster name

  # Create a latest tag for the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'northamerica-northeast2-docker.pkg.dev/ecommerce-451423/ecommerce-backend/ecommerce-backend:$COMMIT_SHA', 'northamerica-northeast2-docker.pkg.dev/ecommerce-451423/ecommerce-backend/ecommerce-backend:latest']

  # Push the latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'northamerica-northeast2-docker.pkg.dev/ecommerce-451423/ecommerce-backend/ecommerce-backend:latest']

options:
  logging: CLOUD_LOGGING_ONLY