apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce
  template:
    metadata:
      labels:
        app: ecommerce  # Corrected metadata labels here
    spec:
      containers:
        - name: backend-containers
          image: northamerica-northeast2-docker.pkg.dev/ecommerce-451423/ecommerce-backend/ecommerce-backend:v1
          ports:
            - containerPort: 8080
